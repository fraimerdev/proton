.button {

.segmented[data-indicator] .segmented-option {
  transition:
    background var(--motion-fast) var(--ease-standard),
    color var(--motion-normal) var(--ease-standard);
}

.segmented-option:hover:not(:disabled):not([aria-checked="true"]):not([aria-selected="true"]):not(
  [aria-current="page"]
) {
  color: var(--text-secondary);
  background: var(--surface-hover);
}

.segmented-option[aria-checked="true"],
.segmented-option[aria-selected="true"],
.segmented-option[aria-current="page"] {
  color: var(--text-primary);
}

.segmented:not([data-indicator]) .segmented-option[aria-checked="true"],
.segmented:not([data-indicator]) .segmented-option[aria-selected="true"],
.segmented:not([data-indicator]) .segmented-option[aria-current="page"] {
  background: var(--surface-selected);
}

.segmented-option:disabled {
  opacity: 0.45;
}

/* The severity scale reads as one control, so only its selected end takes the accent. */
.segmented.accent .segmented-option[aria-checked="true"] {
  color: var(--text-primary);
  font-weight: var(--weight-semibold);
}

.segmented.accent .segmented-option[aria-checked="true"][data-tone="off"] {
  color: var(--text-secondary);
}

.segmented.accent .segmented-option[aria-checked="true"][data-tone="warning"] {
  color: var(--on-warning);
}

.segmented.accent .segmented-option[aria-checked="true"][data-tone="danger"] {
  color: var(--on-danger);
}

.segmented.accent:not([data-indicator]) .segmented-option[aria-checked="true"][data-tone="warning"],
.segmented.accent .segmented-thumb[data-tone="warning"] {
  background: var(--warning);
}

.segmented.accent:not([data-indicator]) .segmented-option[aria-checked="true"][data-tone="danger"],
.segmented.accent .segmented-thumb[data-tone="danger"] {
  background: var(--danger);
}

.segmented.block {
  display: flex;
}

.segmented.block .segmented-option {
  flex: 1 1 0;
}

.area-tabs {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 24px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}

.area-tabs::-webkit-scrollbar {
  display: none;
}

.area-tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 11px;
  color: var(--tab-inactive);
  font-size: var(--text-body);
  font-weight: var(--weight-medium);
  white-space: nowrap;
  transition: color var(--motion-normal) var(--ease-standard);
}

.area-tab::after {
  content: "";
  position: absolute;
  inset: auto 8px -1px;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: transparent;
  transition: background var(--motion-fast) var(--ease-standard);
}

.area-tab:hover {
  color: var(--text-secondary);
}

.area-tab[aria-current="page"],
.area-tab[aria-selected="true"] {
  color: var(--text-primary);
}

.area-tab[aria-current="page"]::after,
.area-tab[aria-selected="true"]::after {
  background: var(--highlight);
}

.area-tabs[data-indicator] .area-tab::after {
  display: none;
}

.area-tabs-indicator {
  display: none;
  position: absolute;
  bottom: -1px;
  left: 8px;
  width: calc(var(--indicator-width) - 16px);
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--highlight);
  transform: translateX(var(--indicator-x));
  transition:
    transform var(--motion-normal) var(--ease-standard),
    width var(--motion-normal) var(--ease-standard);
}

.area-tabs[data-indicator] > .area-tabs-indicator {
  display: block;
}

.area-tab-count {
  color: var(--text-muted);
  font-size: var(--text-micro);
  font-variant-numeric: tabular-nums;
}

.search-field {
  position: relative;
  display: flex;
  align-items: center;
}

.search-field-icon {
  position: absolute;
  left: 9px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-field .input {
  padding-left: 31px;
}

.search-field-clear {
  position: absolute;
  right: 6px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard);
}

.search-field-clear:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 8px;
  background: var(--surface-sunken);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: var(--text-secondary-size);
  font-weight: var(--weight-medium);
  max-width: 100%;
}

.chip-remove {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: -3px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard);
}

.chip-remove:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.chip-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: var(--radius-pill);
  background: currentColor;
}

.chip-add {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  background: var(--surface-sunken);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition:
    background var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard);
}

.chip-add svg {
  transition: transform var(--motion-fast) var(--ease-standard);
}

.chip-add:hover:not(:disabled) {
  background: var(--surface-hover);
  color: var(--text-primary);
}

@media (prefers-reduced-motion: no-preference) {
  .chip-add:active:not(:disabled) svg {
    transform: scale(1.25);
  }
}

.chip-add[aria-expanded="true"] {
  background: var(--surface-selected);
  color: var(--text-primary);
}

.chip-add[aria-invalid="true"] {
  border-color: var(--danger);
}

.chip-add:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: var(--radius-xs);
  font-size: var(--text-micro);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.005em;
  white-space: nowrap;
}

.badge-neutral {
  background: var(--badge-neutral-bg);
  color: var(--badge-neutral-text);
}

.badge-success {
  background: var(--badge-success-bg);
  color: var(--success);
}

.badge-warning {
  background: var(--badge-warning-bg);
  color: var(--warning);
}

.badge-danger {
  background: var(--badge-danger-bg);
  color: var(--danger);
}

.badge-info {
  background: var(--badge-info-bg);
  color: var(--info);
}

.badge-primary {
  background: var(--badge-brand-bg);
  color: var(--badge-brand-text);
}

.popover {
  position: fixed;
  z-index: var(--z-popover);
  min-width: 200px;
  padding: 5px;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popover);
}

.popover-scroll {
  max-height: 300px;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin: -5px;
  padding: 5px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 30px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  font-weight: var(--weight-book);
  text-align: left;
  transition:
    background var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard);
}

.menu-item:hover:not(:disabled),
.menu-item[data-active="true"] {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.menu-item[aria-selected="true"] {
  background: var(--surface-selected);
  color: var(--text-primary);
}

.menu-item:disabled {
  color: var(--text-disabled);
}

.menu-item-danger {
  color: var(--danger);
}

.menu-item-danger:hover:not(:disabled) {
  background: var(--danger-soft);
  color: var(--danger);
}

.menu-label {
  padding: 7px 8px 4px;
  color: var(--text-muted);
  font-size: var(--text-label);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.menu-separator {
  height: 6px;
}

.menu-item-check {
  flex: none;
  margin-left: auto;
  color: var(--highlight);
}

.banner {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--surface-1);
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  line-height: 1.5;
}

.banner + .banner {
  margin-top: 8px;
}

.banner-icon {
  flex: none;
  margin-top: 1px;
}

.banner-main {
  flex: 1 1 auto;
  min-width: 0;
}

.banner-title {
  color: var(--text-primary);
  font-size: var(--text-body);
  font-weight: var(--weight-semibold);
}

.banner-body {
  max-width: 78ch;
}

.banner-title + .banner-body {
  margin-top: 3px;
}

.banner-actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  align-self: center;
}

.banner-warning {
  background: var(--warning-soft);
}

.banner-warning .banner-icon {
  color: var(--warning);
}

.banner-danger {
  background: var(--danger-soft);
}

.banner-danger .banner-icon {
  color: var(--danger);
}

.banner-info {
  background: var(--info-soft);
}

.banner-info .banner-icon {
  color: var(--info);
}

.banner-success {
  background: var(--success-soft);
}

.banner-success .banner-icon {
  color: var(--success);
}

.banner-dismiss {
  display: grid;
  place-items: center;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard);
}

.banner-dismiss:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.page-banners {
  margin-bottom: 20px;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 40px 24px;
  text-align: center;
}

.empty-icon {
  margin-bottom: 4px;
  color: var(--text-disabled);
}

.empty-title {
  color: var(--text-primary);
  font-size: var(--text-row-title);
  font-weight: var(--weight-semibold);
}

.empty-body {
  color: var(--text-muted);
  font-size: var(--text-secondary-size);
  max-width: 52ch;
}

.empty-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

.empty.inset {
  background: var(--surface-1);
  border-radius: var(--radius-md);
}

.savebar-spacer {
  height: 88px;
}

.savebar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  z-index: var(--z-savebar);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 28px;
  width: fit-content;
  max-width: min(720px, calc(100vw - 32px));
  margin-inline: auto;
  padding: 10px 10px 10px 20px;
  background: var(--app-topbar);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-popover);
  --enter-y: calc(100% + 24px);
  --enter-scale: 1;
  animation: motion-enter var(--motion-slow) var(--ease-spring-soft) backwards;
  transition: background-color var(--motion-normal) var(--ease-standard);
}

.savebar-text {
  flex: 1 1 auto;
  min-width: 0;
}

.savebar-title {
  color: var(--text-primary);
  font-size: var(--text-row-title);
  font-weight: var(--weight-section);
  letter-spacing: -0.006em;
  transition: opacity var(--motion-fast) var(--ease-standard);
}

.savebar-note {
  max-width: 52ch;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: var(--text-micro);
  transition:
    opacity var(--motion-fast) var(--ease-standard),
    color var(--motion-normal) var(--ease-standard);
}

.savebar-actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  transition: opacity var(--motion-fast) var(--ease-standard);
}

.savebar .savebar-save {
  background: var(--save);
  color: var(--on-save);
}

.savebar .savebar-save:hover:not(:disabled) {
  background: var(--save-hover);
}

.savebar .savebar-save:active:not(:disabled) {
  background: var(--save-pressed);
}

/* Laid over the unsaved row rather than swapped in for it, so the toast keeps its width. */
.savebar-done {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding-inline: 20px;
  color: var(--on-save);
  font-size: var(--text-row-title);
  font-weight: var(--weight-section);
  letter-spacing: -0.006em;
  pointer-events: none;
  --enter-y: 6px;
}

/* motion-enter stays first in the list so dropping .saved does not replay the entrance. */
.savebar.saved {
  background: var(--save);
  animation:
    motion-enter var(--motion-slow) var(--ease-spring-soft) backwards,
    savebar-saved var(--motion-normal) var(--ease-spring-soft);
}

.savebar.saved .savebar-title,
.savebar.saved .savebar-note,
.savebar.saved .savebar-actions {
  opacity: 0;
}

@keyframes savebar-saved {
  45% {
    transform: scale(1.04);
  }
}

.savebar.alarmed {
  background: var(--save-refused);
}

.savebar.alarmed .savebar-title,
.savebar.alarmed .savebar-note,
.savebar.alarmed .button-ghost {
  color: var(--on-save);
}

.savebar.leaving {
  --exit-y: calc(100% + 24px);
  --exit-scale: 1;
  pointer-events: none;
  animation: motion-exit var(--motion-slow) var(--ease-exit) forwards;
}

@media (max-width: 900px) {
  .savebar {
    bottom: 12px;
    max-width: calc(100vw - 24px);
  }
}

.popover {
  --enter-y: -8px;
  --enter-scale: 0.96;
  animation: motion-enter var(--motion-normal) var(--ease-enter) backwards;
}

.popover[data-side="top"] {
  --enter-y: 8px;
}

.popover.leaving {
  pointer-events: none;
  animation: motion-fade-out var(--motion-fast) var(--ease-standard) forwards;
}

.placeholder-suggestions {
  position: fixed;
  z-index: calc(var(--z-dialog) + 1);
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 280px;
  max-width: min(420px, calc(100vw - 16px));
  padding: 5px;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popover);
  animation: motion-fade-in var(--motion-fast) var(--ease-standard) backwards;
}

.placeholder-suggestion {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
  grid-template-areas:
    "token sample"
    "label label";
  align-items: baseline;
  column-gap: 12px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  text-align: left;
  transition: background-color var(--motion-fast) var(--ease-standard);
}

.placeholder-suggestion[aria-selected="true"] {
  background: var(--surface-selected);
  color: var(--text-primary);
}

.placeholder-suggestion-token,
.placeholder-suggestion-sample,
.placeholder-suggestion-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.placeholder-suggestion-token {
  grid-area: token;
  color: var(--text-primary);
}

.placeholder-suggestion-sample {
  grid-area: sample;
  justify-self: end;
  max-width: 100%;
  color: var(--text-muted);
  font-size: var(--text-micro);
}

.placeholder-suggestion-label {
  grid-area: label;
  color: var(--text-muted);
  font-size: var(--text-micro);
}

@media (max-width: 559px) {
  .placeholder-suggestions {
    min-width: 0;
  }

  .placeholder-suggestion {
    min-height: 44px;
    padding-block: 7px;
  }
}

.dialog-scrim {
  position: fixed;
  inset: 0;
  z-index: var(--z-dialog);
  display: grid;
  place-items: center;
  padding: 24px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* The overlay fades on its own layer, so the panel's opacity never compounds with it. */
.dialog-scrim::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--overlay);
  animation: motion-fade-in var(--motion-normal) var(--ease-standard) backwards;
}

.dialog-scrim.leaving::before {
  animation: motion-fade-out var(--motion-fast) var(--ease-exit) forwards;
}

.dialog-scrim ~ .popover {
  z-index: calc(var(--z-dialog) + 1);
}

.dialog {
  width: 100%;
  max-width: 440px;
  background: var(--surface-1);
  border-radius: var(--radius-dialog);
  box-shadow: var(--shadow-dialog);
  --enter-y: 16px;
  --enter-scale: 0.94;
  animation: motion-enter var(--motion-slow) var(--ease-enter) backwards;
}

.dialog.leaving {
  --exit-scale: 0.95;
  pointer-events: none;
  animation: motion-exit var(--motion-fast) var(--ease-exit) forwards;
}

.dialog.wide {
  max-width: 720px;
}

.dialog.editor {
  max-width: 1000px;
}

.dialog-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 18px 0;
}

.dialog-title {
  flex: 1 1 auto;
  font-size: var(--text-section-title);
  font-weight: var(--weight-section);
  letter-spacing: -0.011em;
}

.dialog-description {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: var(--text-secondary-size);
}

.dialog-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.dialog-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 0 18px 16px;
}

.dialog-foot-note {
  margin-right: auto;
  color: var(--text-muted);
  font-size: var(--text-secondary-size);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  font-weight: var(--weight-medium);
}

.field-hint {
  color: var(--text-muted);
  font-size: var(--text-micro);
}

.field-error {
  color: var(--danger);
  font-size: var(--text-micro);
}

.field-warning {
  color: var(--warning);
  font-size: var(--text-micro);
}

.template-diagnostics {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.table-wrap {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.table-scroll {
  overflow-x: auto;
  overscroll-behavior-x: contain;
}

.table {
  width: 100%;
  font-size: var(--text-secondary-size);
}

.table th {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  padding: 8px 14px;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: var(--text-micro);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.03em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

.table th.sortable {
  cursor: pointer;
  user-select: none;
  transition: color var(--motion-fast) var(--ease-standard);
}

.table th.sortable:hover {
  color: var(--text-secondary);
}

.table th .sort-icon {
  display: inline-block;
  margin-left: 4px;
  vertical-align: -2px;
  color: var(--highlight);
}

.table td {
  padding: 9px 14px;
  color: var(--text-secondary);
  vertical-align: middle;
  transition: background-color var(--motion-fast) var(--ease-standard);
}

.table tbody tr:hover td,
.table tbody tr.clickable:focus-visible td {

}

.table tbody tr.clickable {

}

.table tbody tr.table-loading:hover td {

}

.table td.table-loading-cell {

}

.table td.numeric,
.table th.numeric {

  font-variant-numeric: tabular-nums;
}

.table td.primary-cell {
  color: var(--text-primary);
  font-weight: var(--weight-medium);
}

.table-toolbar {
  display: flex;
  align-items: center;

  padding: 12px 14px;
}

  flex-direction: column;
}

.stack-4 {
  gap: 4px;
}
.stack-6 {
  gap: 6px;
}
.stack-8 {
  gap: 8px;
}
.stack-10 {
  gap: 10px;
}
.stack-12 {
  gap: 12px;
}
.stack-16 {
  gap: 16px;
}
.stack-20 {
  gap: 20px;
}

.inline {
  display: flex;
  align-items: center;
}

.inline-6 {
  gap: 6px;
}
.inline-8 {
  gap: 8px;
}
.inline-12 {
  gap: 12px;
}

.inline-wrap {
  flex-wrap: wrap;
}

.push-right {
  margin-left: auto;
}

.text-muted {
  color: var(--text-muted);
}

.text-secondary {
  color: var(--text-secondary);
}

.text-danger {
  color: var(--danger);
}

.text-warning {
  color: var(--warning);
}

.text-success {
  color: var(--success);
}

.text-sm {
  font-size: var(--text-secondary-size);
}

.text-xs {
  font-size: var(--text-micro);
}

.spinner {

  animation: loading-reveal var(--motion-fast) var(--ease-standard) var(--loading-delay) both;
}

.spinner-fallback {
  animation-delay: var(--loading-delay-fallback);
}

.spinner-icon {
  flex: none;
  animation: spin 0.8s linear infinite;
}

.loading-area {

  place-items: center;
  width: 100%;
  min-height: 160px;

}

.page:has(> .loading-area-fill) {

.loading-area-fill {

}

@keyframes loading-reveal {

.section + .section {

.section-label {

  font-weight: var(--weight-semibold);

  text-transform: uppercase;
}

.section-label-note {

  font-size: var(--text-micro);
  font-weight: var(--weight-regular);
  letter-spacing: 0;
  text-transform: none;
}

.section-intro {
  margin: -2px 0 12px;
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  max-width: 72ch;
}

.section-title {
  font-size: var(--text-section-title);
  font-weight: var(--weight-section);
  letter-spacing: -0.011em;
}

.rows {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.rows + .rows {
  margin-top: 10px;
}

.row {
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: var(--row-min-height);
  padding: 11px 16px;
}

.row-main {
  flex: 1 1 auto;
  min-width: 0;
}

.row-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
  font-size: var(--text-row-title);
  font-weight: var(--weight-semibold);
  letter-spacing: -0.008em;
}

.row-description {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: var(--text-secondary-size);
  line-height: 1.46;
  max-width: 62ch;
}

.row-control {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.row.stacked {
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
}

.row.stacked .row-control {
  justify-content: flex-start;
}

.row-error {
  margin-top: 6px;
  color: var(--danger);
  font-size: var(--text-secondary-size);
}

.row-note {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: var(--text-secondary-size);
}

.row.disabled .row-title,
.row.disabled .row-description {
  color: var(--text-disabled);
}

.nav-row {
  display: flex;
  align-items: center;

  min-height: 64px;

.nav-row-icon {

@media (prefers-reduced-motion: no-preference) {

  }

.row-disclosure {

  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition:

    color var(--motion-fast) var(--ease-standard);
}

.row-disclosure:hover {
  background: var(--surface-hover);

}

.row-disclosure svg {
  transition: transform var(--motion-normal) var(--ease-standard);
}

.row-disclosure[aria-expanded="true"] svg {

}

/* The detail panel belongs to the row above it, so it shares the row's background, not a card. */
.row-detail {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  background: var(--surface-1);
  transition:
    grid-template-rows var(--motion-fast) var(--ease-standard),
    opacity var(--motion-fast) var(--ease-exit);
}

.row-detail[data-expanded] {
  grid-template-rows: 1fr;
  opacity: 1;
  transition:
    grid-template-rows var(--motion-normal) var(--ease-enter),
    opacity var(--motion-normal) var(--ease-enter);
}

.row-detail-clip {
  min-height: 0;
}

.row-detail[data-moving] > .row-detail-clip {

}

}

.row-detail-inner {
  display: flex;
  flex-wrap: wrap;

.row-detail-field {
  display: flex;
  flex-direction: column;

.row-detail-explain {

.collection-head-main {

.collection-title {

}

.matrix-row:hover {

.matrix-row-name {

  white-space: nowrap;
}

}

.matrix-toolbar {

  min-width: 200px;
}

@media (max-width: 760px) {

    flex-wrap: wrap;

    width: 100%;
    justify-content: flex-start;
  }
}

.pairs {
  display: grid;
  grid-template-columns: minmax(140px, 200px) minmax(0, 1fr);
  gap: 10px 18px;
  align-items: center;
}

.pairs-label {
  color: var(--text-secondary);
  font-size: var(--text-secondary-size);
  font-weight: var(--weight-medium);
}

@media (max-width: 640px) {
  .pairs {
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;

    flex-direction: column;

    width: 100%;
  }

    flex: 1 1 0;

  }
