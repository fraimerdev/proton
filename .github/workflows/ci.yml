name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ubuntu-latest ships a working Docker daemon, which the integration suites
    # need — Testcontainers talks to it directly over the unix socket.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # PLAN.md §12 Gate 0: every one of these must pass on every PR.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        env:
          # Testcontainers pulls postgres:17-alpine and redis:7-alpine per suite.
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Build
        run: bun run build
