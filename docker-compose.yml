name: proton

# Dev-only infrastructure. Integration tests do NOT use these containers —
# Testcontainers starts throwaway instances per suite, so local state can never
# make a test pass or fail.

services:
  postgres:
    image: postgres:17-alpine
    container_name: proton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proton
      POSTGRES_PASSWORD: proton
      POSTGRES_DB: proton
    # Host port 5432 is taken by another project on this machine, and 6379 by a
    # native redis-server service. Override via .env if these collide too.
    ports:
      - '${PROTON_POSTGRES_PORT:-5433}:5432'
    volumes:
      - proton-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proton -d proton']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: proton-redis
    restart: unless-stopped
    # One container, separate logical DBs (PLAN.md §2). Assignments in .env.example:
    #   0 bus · 1 dedupe · 2 gateway sessions · 3 reserved/BullMQ · 4 rate windows
    command: ['redis-server', '--appendonly', 'yes', '--databases', '16']
    ports:
      - '${PROTON_REDIS_PORT:-6381}:6379'
    volumes:
      - proton-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  proton-pgdata:
  proton-redisdata:
