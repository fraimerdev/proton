# /etc/nginx/sites-available/prtn.xyz.conf
#
# Only the dashboard is ever exposed. api (9002) and rest-proxy (9001) bind to 127.0.0.1 and are
# reached by the other Proton processes directly — nginx must not proxy them: the api authenticates
# with a shared secret and the proxy authenticates nothing at all.
#
# The directives above the first server block are http-context and apply to every site on the box.
# Proton is the only one; move them to nginx.conf if that ever stops being true.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:proton_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

limit_req_zone $binary_remote_addr zone=proton_dashboard_reqs:10m rate=30r/s;

upstream proton_dashboard {
    server 127.0.0.1:9000;
    keepalive 32;
    # Under serve.ts's 60s idleTimeout, so nginx retires an idle upstream connection before Bun
    # closes it underneath a request.
    keepalive_timeout 30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name prtn.xyz www.prtn.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://prtn.xyz$request_uri;
    }
}

server {
    # `listen ... http2` rather than a separate `http2 on;`, which needs nginx 1.25.1 and Ubuntu
    # 24.04 ships 1.24. Newer nginx accepts this form with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.prtn.xyz;

    ssl_certificate /etc/letsencrypt/live/prtn.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prtn.xyz/privkey.pem;

    return 301 https://prtn.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prtn.xyz;

    ssl_certificate /etc/letsencrypt/live/prtn.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prtn.xyz/privkey.pem;

    access_log /var/log/nginx/prtn.xyz.access.log;
    error_log /var/log/nginx/prtn.xyz.error.log;

    root /srv/proton/apps/dashboard/dist/client;

    client_max_body_size 4m;
    # Server-function calls carry a base64 function id in the path; the 8k default truncates the
    # longest of them into a 414.
    large_client_header_buffers 4 32k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed filenames from the Vite build.
    location /assets/ {
        access_log off;

        # add_header does not inherit into a location that declares one, so the security headers
        # above are repeated here.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /shots/ {
        access_log off;
        expires 7d;
    }

    location = /favicon.ico {
        access_log off;
        expires 7d;
    }

    location = /apple-touch-icon.png {
        access_log off;
        expires 7d;
    }

    location = /proton-mark.png {
        access_log off;
        expires 7d;
    }

    # Everything else is SSR. Any public file not fast-pathed above still resolves — serve.ts
    # serves dist/client itself — it simply does not get nginx's caching headers.
    location / {
        limit_req zone=proton_dashboard_reqs burst=60 nodelay;

        proxy_pass http://proton_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Better Auth derives the request origin from these; a rewritten Host or a missing
        # X-Forwarded-Proto makes every OAuth callback fail its origin check.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSR is streamed: buffering holds the whole document back until the last byte renders.
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
